<style>
/* Layout: one viewer (3D + live plan) at the top, AG's tap questions under it, general note last. */
:root{
  --bg:#f1f0ec;--surface:#ffffff;--surface2:#f6f5f2;--ink:#1c1b19;--muted:#67625b;--line:#dcd8d0;

  --fence:#3a2e24;--tentfill:#f6eedd;--tentline:#5a4330;--seat:#f1ebdf;--wood:#8a5a2c;--gravel:#d3c8b5;
  --lamp:#f2a516;--water:#3a7db3;--sewage:#7d6b45;--cab:#e46d1e;--sel:#1f6fd1;
  --f-display:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111316;--surface:#1a1d22;--surface2:#21252c;--ink:#ece9e3;--muted:#a39e95;--line:#30343c;
  --accent:#ff7b3c;--accent-ink:#1d0d04;--good:#5fc48d;
  --plot:#6a4127;--outside:#25282e;--grid:rgba(255,240,210,.07);--grid5:rgba(255,240,210,.17);
  --fence:#eadcc5;--tentfill:#3d3429;--tentline:#e6cda9;--seat:#e4dccd;--wood:#c08a5b;--gravel:#6e6659;
  --lamp:#ffc95a;--water:#6cabdc;--sewage:#b89f6c;--cab:#ff9a4d;--sel:#6aa8ff;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111316;--surface:#1a1d22;--surface2:#21252c;--ink:#ece9e3;--muted:#a39e95;--line:#30343c;

  --plot:#6a4127;--outside:#25282e;--grid:rgba(255,240,210,.07);--grid5:rgba(255,240,210,.17);

.wrap{max-width:1520px;margin:0 auto;padding-block:14px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.45rem,3vw,2.05rem)}
h2{font-size:1.2rem}
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 18px}
.meta{color:var(--muted);font-variant-numeric:tabular-nums}
.save-state{font-size:.86rem;color:var(--muted)}
.save-state.ok{color:var(--good)}
button{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:7px 11px;min-height:38px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,.opt:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.viewer{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.vbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg .btn{border:0;border-radius:0;min-height:36px}
.vbar .hint{color:var(--muted);font-size:.82rem;margin-left:auto}
.panes{display:grid;grid-template-columns:minmax(0,1fr);height:min(76vh,860px);min-height:440px}

.svgbox{flex:1;min-height:0;display:flex;justify-content:center;padding:6px;overflow:hidden}

.selbar{border-top:1px solid var(--line);padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface2)}
.selbar strong{font-family:var(--f-display);margin-right:4px}
.selbar label{display:inline-flex;align-items:center;gap:4px;font-size:.85rem;color:var(--muted)}
.selbar input{width:62px;padding:6px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.addmenu{position:absolute;z-index:5;top:52px;left:8px;right:8px;max-height:70%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
/* plan drawing */
.pl-out{fill:var(--outside)}.pl-plot{fill:var(--plot)}
.pl-grid{stroke:var(--grid);stroke-width:.04}.pl-grid5{stroke:var(--grid5);stroke-width:.06}
.pl-txt{fill:var(--muted);font-family:var(--f-body);font-size:.75px}
.pl-lbl{fill:var(--ink);font-family:var(--f-body);font-size:.66px;font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:.16px;pointer-events:none}
.pl-fence{stroke:var(--fence);stroke-width:.16;fill:none}
.pl-open{stroke:var(--fence);stroke-width:.06;stroke-dasharray:.3 .3;fill:none}
.pl-pole{fill:var(--fence)}.pl-polelit{fill:var(--lamp);stroke:var(--fence);stroke-width:.05}
.it{cursor:pointer}
.it .sh{stroke:rgba(0,0,0,.35);stroke-width:.05}
.it.sel .sh{stroke:var(--sel);stroke-width:.14}
.it.sel{touch-action:none}
.cab line,.cab polyline{stroke:var(--cab);stroke-width:.12;stroke-dasharray:.45 .25;fill:none}
.dim line{stroke:var(--sel);stroke-width:.05}
.dim text{fill:var(--sel);font-size:.62px;font-weight:600;font-family:var(--f-body);paint-order:stroke;stroke:var(--surface);stroke-width:.14px}

.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;align-items:start}

.q .why{margin:-4px 0 0;font-size:.84rem;color:var(--muted)}
.q .multi{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 11px;min-height:44px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:9px;max-width:100%}

.gen{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.gen .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.next{color:var(--muted);font-size:.9rem;margin:0}

@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

  bbq:{n:'BBQ grill',w:1.6,d:0.8}, coffee:{n:'Coffee corner',w:2,d:0.9}, palm:{n:'Palm tree',w:3,d:3,round:1},
  sink:{n:'Hand-wash sink',w:0.8,d:0.5}, ext:{n:'Fire extinguisher',w:0.4,d:0.4}, screen:{n:'Movie screen',w:3.2,d:0.3},
  play:{n:'Kids play corner',w:5,d:5}, gen:{n:'Generator',w:2.2,d:1.1}, bench:{n:'Bench',w:1.8,d:0.5},
  baffle:{n:'Entrance screen wall',w:6.5,d:2}, tv:{n:'TV',w:1.6,d:0.4}, speaker:{n:'Speaker',w:0.45,d:0.45}, chair:{n:'Armchair',w:0.8,d:0.8}
};
MJ.ADDABLE = ['person','bonfire','path','seat','chair','table','bench','lantern','corner','festoon','palm','bbq','coffee',
  'baffle','toilets','pantry','sink','ext','tv','speaker','screen','gen','play','car'];
/* Recommended answers: the plan uses these until AG taps something else. */
MJ.REC = {front:'closed', gate:'3', tent:'A-left', wc:'front', truck:[], north:'', power:'grid', lstep:'2',
  lstyle:['lantern'], ac:'ducted', seats:'floor', addons:[], inside:[]};
MJ.ans = {}; MJ.cmt = {};
MJ.val = k => { const a = MJ.ans[k]; if (Array.isArray(a)) return a; if (a != null && a !== '') return a; return MJ.REC[k]; };

MJ.rot = (x,y,r) => { const a=r*Math.PI/180, c=Math.cos(a), s=Math.sin(a); return [x*c-y*s, x*s+y*c]; };
MJ.toPlan = (it,lx,ly) => { const p = MJ.rot(lx,ly,it.r||0); return [it.x+p[0], it.y+p[1]]; };
MJ.face = (dx,dy) => Math.atan2(dx,-dy)*180/Math.PI;
MJ.aabb = it => {
  const hw=it.w/2, hd=it.d/2;
  if ((MJ.CAT[it.t]||{}).round) return [it.x-hw, it.y-hd, it.x+hw, it.y+hd];
  const xs=[], ys=[];
  [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].forEach(c => { const p=MJ.toPlan(it,c[0],c[1]); xs.push(p[0]); ys.push(p[1]); });
  return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
};
let seq = 0;
MJ.uid = t => t + '-' + Date.now().toString(36).slice(-4) + (++seq);
MJ.clone = o => JSON.parse(JSON.stringify(o));
MJ.find = id => MJ.L.items.find(i => i.id === id);

function base(){ return {v:1, fence:{frontClosed:true, step:2}, lights:{every:2, styles:['lantern']}, ac:'ducted', seats:'floor', north:'', items:[]}; }
function add(L,it){ const c=MJ.CAT[it.t]||{w:1,d:1}; if(it.w==null) it.w=c.w; if(it.d==null) it.d=c.d; if(it.r==null) it.r=0; if(!it.id) it.id=MJ.uid(it.t); L.items.push(it); return it; }
function put(L,id,t,props){ let it=L.items.find(i=>i.id===id); if(!it){ it={id,t}; add(L,it); } Object.assign(it,props); return it; }
function drop(L,pred){ L.items = L.items.filter(i => !pred(i)); }
MJ.addItem = (it) => add(MJ.L, it);

/* Back zone (tent, pantry, AC) for the four tent answers. */
MJ.tentPlace = mode => {
  const B = /^B/.test(mode||''), right = /right$/.test(mode||'');
  /* the pantry is joined to the back of the tent: one door into the tent, one door to the outside */
  let z = !B
    ? {tent:{x:7.5,y:34,r:0}, gate:7.5, pathTo:31, fire:[13,20], pantry:{x:2.5,y:38.25,r:0,w:4,d:2.4,doors:['front','right']}, ac:{x:8,y:39.3,r:0}, bbq:{x:16.8,y:33.5,r:0}}
    : {tent:{x:3.5,y:30,r:90}, gate:12.5, pathTo:30, link:[9.5,30,6], fire:[5.1,15.2], pantry:{x:3.5,y:38.25,r:0,w:6,d:2.4,doors:['front','right']}, ac:{x:13,y:39.3,r:0}, bbq:{x:10.8,y:38.7,r:0}};
  if (right){
    const m = p => Object.assign({}, p, {x:20-p.x, r:p.r ? -p.r : 0});
    z.tent=m(z.tent); z.pantry=m(z.pantry); z.ac=m(z.ac); z.bbq=m(z.bbq);
    z.pantry.doors = z.pantry.doors.map(s => s==='left' ? 'right' : s==='right' ? 'left' : s);
    z.gate = 20 - z.gate; z.fire = [20 - z.fire[0], z.fire[1]]; if (z.link) z.link = [20 - z.link[0], z.link[1], z.link[2]];
  }
  return z;
};

/* Closed tent sides follow the fence and the pantry: a side within 1.6 m of the fence, or touching the pantry, is closed. */
MJ.autoClosed = t => {
  const P = MJ.L.items.find(i => i.id==='pantry'), pb = P ? MJ.aabb(P) : null, hw = t.w/2, hd = t.d/2, out = [];
  t.pantrySide = null;
  const S = {front:[0,-hd,0,-1,1], back:[0,hd,0,1,1], left:[-hw,0,-1,0,0], right:[hw,0,1,0,0]};
  for (const s in S){
    const [lx,ly,nx,ny,ax] = S[s], m = MJ.toPlan(t,lx,ly), n = MJ.rot(nx,ny,t.r||0);
    let dist = Infinity;
    if (n[0]>0.7) dist = 20-m[0]; else if (n[0]<-0.7) dist = m[0]; else if (n[1]>0.7) dist = 40-m[1]; else if (n[1]<-0.7) dist = m[1];
    if (pb){
      const half = ax ? hw : hd;
      for (let k=0;k<=12;k++){ const a = -half + 2*half*k/12, q = MJ.toPlan(t, ax ? a : lx+nx*0.5, ax ? ly+ny*0.5 : a);
        if (q[0]>pb[0]-0.15 && q[0]<pb[2]+0.15 && q[1]>pb[1]-0.15 && q[1]<pb[3]+0.15){
          dist = 0; t.pantrySide = s; const c = MJ.rot(P.x-t.x, P.y-t.y, -(t.r||0)); t.pantryDoor = +(ax ? c[0] : c[1]).toFixed(2); break; } }
    }
    if (dist < 1.6) out.push(s);
  }
  return out.length ? out : ['back'];
};
/* Keep the tent long side as its width, recompute closed sides, rebuild the inside when they change. */
MJ.syncTent = () => {
  const t = MJ.L.items.find(i => i.id==='tent'); if (!t) return false;
  let changed = false;
  if (t.d > t.w){ const w = t.w; t.w = t.d; t.d = w; t.r = (((t.r||0)+90)%360+360)%360; changed = true; }
  const before = JSON.stringify([t.closed, t.pantrySide, t.pantryDoor]);
  t.closed = MJ.autoClosed(t);
  if (changed || before !== JSON.stringify([t.closed, t.pantrySide, t.pantryDoor])){ MJ.tentInterior(MJ.L); return true; }
  return false;
};

/* Seats, tables and lights inside the tent follow its closed sides. */
MJ.tentInterior = L => {
  const t = L.items.find(i => i.id==='tent') || L.items.find(i => i.t==='tent');
  drop(L, i => i.follow==='tent');
  if (!t) return;
  const cl = t.closed || ['back'], hw = t.w/2, hd = t.d/2, sd = 0.9, ins = 0.15, style = L.seats || 'floor', inside = MJ.val('inside');
  const SD = {back:{p:a=>[a,hd], n:[0,-1], rr:0, x:1}, front:{p:a=>[a,-hd], n:[0,1], rr:180, x:1}, left:{p:a=>[-hw,a], n:[1,0], rr:90, x:0}, right:{p:a=>[hw,a], n:[-1,0], rr:-90, x:0}};
  const len = s => SD[s].x ? t.w : t.d;
  const mk = (type,lx,ly,rr,props) => { const p = MJ.toPlan(t,lx,ly); return add(L, Object.assign({t:type, x:+p[0].toFixed(3), y:+p[1].toFixed(3), r:(((t.r||0)+rr)%360+360)%360, follow:'tent'}, props||{})); };
  const at = (s,a,off) => { const q = SD[s], p = q.p(a); return [p[0]+q.n[0]*off, p[1]+q.n[1]*off]; };
  const place = (type,s,a,off,dr,props) => { const p = at(s,a,off); return mk(type,p[0],p[1],SD[s].rr+(dr||0),props); };
  /* seat runs along the closed sides; the longer side runs into the corner, the shorter one stops before it */
  const runs = [];
  cl.forEach(s => {
    const q = SD[s], h = len(s)/2; let a0 = -h+0.2, a1 = h-0.2, open0 = true, open1 = true;
    cl.forEach(o => { if (o===s || SD[o].x===q.x) return;
      if (len(o) > len(s) || (len(o)===len(s) && o<s)){ const atMax = q.x ? o==='right' : o==='back'; if (atMax){ a1 = h-ins-sd-0.05; open1 = false; } else { a0 = -h+ins+sd+0.05; open0 = false; } }
      else { const atMax = q.x ? o==='right' : o==='back'; if (atMax) open1 = false; else open0 = false; } });
    if (s===t.pantrySide){ const d = Math.max(a0+0.6, Math.min(a1-0.6, t.pantryDoor||0)); runs.push({s,a0,a1:d-0.55,open0,open1:false,door:1}, {s,a0:d+0.55,a1,open0:false,open1,door:1}); }
    else runs.push({s,a0,a1,open0,open1});
  });
  /* coffee corner inside: against the pantry wall, at the end that faces an open side */
  if (inside.includes('coffeein')){
    const r = runs.filter(r => r.door && (r.open0 || r.open1) && r.a1-r.a0>1.2)[0] || runs.filter(r => (r.open0 || r.open1) && r.a1-r.a0>2.5).sort((a,b) => (b.a1-b.a0)-(a.a1-a.a0))[0];
    if (r){ const cw = Math.min(2.2, r.a1-r.a0); if (r.open1){ place('coffee',r.s,r.a1-cw/2,ins+0.3,0,{w:cw,d:0.6}); r.a1 -= cw+0.1; } else { place('coffee',r.s,r.a0+cw/2,ins+0.3,0,{w:cw,d:0.6}); r.a0 += cw+0.1; } }
  }
  /* mixed seating: two off-white chairs at each end of the main wall */
  if (style==='mixed'){
    const main = cl.slice().sort((a,b) => len(b)-len(a))[0], mr = runs.filter(r => r.s===main);
    const first = mr.sort((a,b) => a.a0-b.a0)[0], last = mr[mr.length-1];
    if (first && first.a1-first.a0 >= 3){ [0.45,1.25].forEach(o => place('chair',main,first.a0+o,ins+0.45,o<1?-20:-8)); first.a0 += 1.7; }
    if (last && last.a1-last.a0 >= 3){ [0.45,1.25].forEach(o => place('chair',main,last.a1-o,ins+0.45,o<1?20:8)); last.a1 -= 1.7; }
  }
  runs.forEach(r => {
    const l = r.a1-r.a0; if (l < 0.8) return;
    place('seat',r.s,(r.a0+r.a1)/2,ins+sd/2,0,{w:+l.toFixed(2),d:sd});
    if (l >= 2.5){ const n = Math.max(1, Math.round(l/3.2)); for (let k=0;k<n;k++) place('table',r.s,r.a0+l*(k+0.5)/n,ins+sd+0.7,0); }
  });
  const longX = t.w >= t.d;   // AG 25 Nov: no lights hanging over the seating
  const shortOpen = (longX ? ['right','left'] : ['back','front']).filter(s => !cl.includes(s))[0];
  if (inside.includes('tv') && shortOpen) place('tv',shortOpen,0,0.45,0);
  const longOpen = (longX ? ['front','back'] : ['left','right']).filter(s => !cl.includes(s))[0];
  if (inside.includes('speakers') && longOpen){ const h = len(longOpen)/2; place('speaker',longOpen,-h+0.5,0.45,0); place('speaker',longOpen,h-0.5,0.45,0); }
};

MJ.wcPlace = L => {
  const gate = L.items.find(i=>i.id==='gate') || {x:7.5}, tent = L.items.find(i=>i.id==='tent');
  let s;
  if (MJ.val('wc')==='back'){
    const left = tent ? tent.x>10 : false, tx = left ? 2.4 : 17.6;
    s = {toilets:{x:tx,y:38.95,r:0}, septic:{x:tx,y:36.4,r:0}, water:{x:left?6.6:13.4,y:38.85,r:0}, sink:{x:left?tx+2.3:tx-2.3,y:39.3,r:0}};
  } else {
    const left = gate.x>10, tx = left ? 2.4 : 17.6;
    s = {toilets:{x:tx,y:4.4,r:180}, septic:{x:tx,y:1.7,r:0}, water:{x:left?6.2:13.8,y:1.5,r:0}, sink:{x:left?tx+2.3:tx-2.3,y:4.5,r:180}};

MJ.genPlace = L => {
  const v = MJ.val('power'), wc = L.items.find(i=>i.id==='wc');
  const ac = L.items.find(i=>i.id==='acout');
  if ((v==='gen' || v==='both') && ac) put(L,'gen','gen',{x:ac.x-ac.w/2-1.25, y:ac.y, r:ac.r||0});   // AG 25 Nov: next to the AC machines
  else if (v==='gen' || v==='both'){ const front = !wc || wc.y<20; put(L,'gen','gen',{x:wc?wc.x:17.6, y:front?-2.3:42.0, r:0}); }
  else drop(L, i => i.id==='gen');
};

MJ.carsPlace = L => {
  const g = L.items.find(i=>i.id==='gate') || {x:7.5}, gen = L.items.find(i=>i.id==='gen');
  const slots = [2.2,5.0,7.8,10.6,13.4,16.2,19.0].filter(x => Math.abs(x-g.x)>3.2 && (!gen || gen.y>20 || Math.abs(x-gen.x)>2.7));
  const pick = slots.length>=3 ? [slots[0], slots[Math.floor(slots.length/2)], slots[slots.length-1]] : slots;
  ['car-1','car-2','car-3'].forEach((id,k) => { const c=L.items.find(i=>i.id===id); if (c && pick[k]!=null){ c.x=pick[k]; c.y=-4.3; c.r=90; } });
};

MJ.peoplePlace = L => {
  const g = L.items.find(i=>i.id==='gate')||{x:7.5}, f = L.items.find(i=>i.id==='fire'), t = L.items.find(i=>i.id==='tent'), wc = L.items.find(i=>i.id==='wc');
  const P = (id,x,y,r) => { const p=L.items.find(i=>i.id===id); if (p){ p.x=+x.toFixed(2); p.y=+y.toFixed(2); p.r=Math.round(r); } };
  P('p1',g.x-0.3,5.5,180); P('p2',g.x+0.35,9.8,180);
  if (f){ const R=f.w/2+0.4; [205,330,95].forEach((deg,k) => { const a=deg*Math.PI/180, x=f.x+Math.cos(a)*R, y=f.y+Math.sin(a)*R; P('p'+(k+3),x,y,MJ.face(f.x-x,f.y-y)); }); }
  if (t){ const a=MJ.toPlan(t,-t.w/2.6,-t.d/2+1.2), b=MJ.toPlan(t,t.w/5,-t.d/2+1.3); P('p6',a[0],a[1],t.r||0); P('p7',b[0],b[1],(t.r||0)+25); }
  if (wc){ const s = wc.x>10 ? -1 : 1, front = wc.y<20; P('p8',wc.x+s*2.6,wc.y+(front?2.4:-2.4),front?180:0); }
};

MJ.addonsPlace = L => {
  const a = MJ.val('addons');
  drop(L, i => i.addon && !a.includes(i.addon));
  const f = L.items.find(i=>i.id==='fire') || {x:13,y:20,w:6.4}, g = L.items.find(i=>i.id==='gate') || {x:7.5};
  const pantry = L.items.find(i=>i.id==='pantry'), R = f.w/2;
  const mk = (id,t,addon,props) => { if (!L.items.some(i=>i.id===id)) add(L, Object.assign({id,t,addon}, props)); };
  if (a.includes('ext')){
    mk('add-ext-1','ext','ext',{x:f.x+(f.x>10?-1:1)*(R+0.7), y:f.y-R-0.2, follow:'fire'});
    if (pantry){ const s = pantry.x<10 ? 1 : -1; mk('add-ext-2','ext','ext',{x:pantry.x+s*2.6, y:pantry.y-0.9}); }
  }
  if (a.includes('sink') && MJ._sinkAt) mk('add-sink','sink','sink',Object.assign({},MJ._sinkAt));

  if (a.includes('coffee')) mk('add-coffee','coffee','coffee',{x:f.x, y:f.y+R+0.9, r:0, follow:'fire'});

  if (a.includes('screen')) mk('add-screen','screen','screen',{x:f.x, y:f.y-R-2.2, r:180, follow:'fire'});

MJ.zone = mode => {
  const L = MJ.L, z = MJ.tentPlace(mode||'A-left');
  const t = put(L,'tent','tent',{x:z.tent.x, y:z.tent.y, r:z.tent.r, w:14, d:6, main:true});
  put(L,'pantry','pantry',z.pantry); put(L,'acout','acout',z.ac);
  put(L,'gate','gate',{x:z.gate, y:0, r:0});
  put(L,'path','path',{x:z.gate, y:z.pathTo/2, d:z.pathTo, r:0, follow:'gate'});
  if (z.link) put(L,'path2','path',{x:z.link[0], y:z.link[1], d:z.link[2], w:1.5, r:90}); else drop(L, i => i.id==='path2');
  put(L,'fire','bonfire',{x:z.fire[0], y:z.fire[1]});
  put(L,'board','board',{x:z.gate+(z.gate<10?-2.6:2.6), y:0.6, r:0, follow:'gate'});
  t.closed = MJ.autoClosed(t);
  MJ.tentInterior(L); MJ.wcPlace(L); MJ.genPlace(L); MJ.carsPlace(L); MJ.peoplePlace(L);
  drop(L, i => !!i.addon); MJ.addonsPlace(L);
};

/* Apply one answer to the current plan. Returns what the views must redraw. */
MJ.applyAnswer = k => {
  const L = MJ.L, v = MJ.val(k);
  switch (k){
    case 'front': L.fence.frontClosed = v !== 'open'; return 'fence';
    case 'gate': { const g = MJ.find('gate'); if (g) g.w = +v || 3; MJ.carsPlace(L); return 'all'; }
    case 'tent': MJ.zone(v); return 'all';
    case 'wc': MJ.wcPlace(L); MJ.genPlace(L); MJ.carsPlace(L); MJ.peoplePlace(L); return 'all';
    case 'power': MJ.genPlace(L); MJ.carsPlace(L); return 'all';
    case 'lstep': L.lights.every = ({every:1,'2':2,'3':3,corners:0})[v]; if (L.lights.every==null) L.lights.every = 2; return 'fence';
    case 'lstyle': L.lights.styles = (v && v.length) ? v.slice() : ['lantern']; return 'fence';
    case 'ac': L.ac = v; return 'all';
    case 'seats': L.seats = v; return 'all';
    case 'north': L.north = v==='unsure' ? '' : (v||''); return 'north';
    case 'addons': MJ.addonsPlace(L); return 'all';
    case 'inside': MJ.tentInterior(L); return 'all';
  }
  return null;
};
const ORDER = ['front','gate','tent','wc','power','lstep','lstyle','ac','seats','north','addons','inside'];
MJ.applyAll = () => { ORDER.forEach(k => { if (k!=='tent' && k!=='wc' && k!=='addons') MJ.applyAnswer(k); }); MJ.zone(MJ.val('tent')); MJ.applyAnswer('gate'); };

MJ.defaultLayout = () => {
  const L = base(); MJ.L = L;
  add(L,{id:'gate',t:'gate',x:7.5,y:0,w:3}); add(L,{id:'tent',t:'tent',x:7.5,y:34,main:true});
  add(L,{id:'path',t:'path',x:7.5,y:15.5,d:31,follow:'gate'}); add(L,{id:'fire',t:'bonfire',x:13,y:20});
  add(L,{id:'pantry',t:'pantry',x:2.6,y:38.6,r:90}); add(L,{id:'acout',t:'acout',x:8,y:39.25}); add(L,{id:'board',t:'board',x:4.9,y:0.6,follow:'gate'});
  [[0.35,0.35],[19.65,0.35],[0.35,39.65],[19.65,39.65]].forEach((c,k) => add(L,{id:'c'+(k+1),t:'corner',x:c[0],y:c[1]}));
  ['k','k','a','k','c','k','a','k'].forEach((s,k) => add(L,{id:'p'+(k+1),t:'person',x:10,y:10,s}));
  [1,2,3].forEach(k => add(L,{id:'car-'+k,t:'car',x:2+k*4,y:-4.3,r:90,col:k}));
  MJ.applyAll();
  return L;
};

/* Moving and turning: a leader carries its followers (tent interior, things round the fire, walkway with the gate). */
MJ.moveBy = (it,dx,dy) => {
  it.x += dx; it.y += dy;
  if (['tent','fire','gate'].includes(it.id)) MJ.L.items.forEach(i => { if (i.follow===it.id){ i.x += dx; i.y += dy; } });
};

const LBL = {tent:['Tent',3.9], bonfire:['Fire pit',1.7], toilets:['2 toilets',2.9], septic:['Sewage tank',0.4], water:['Water tank',1.1],

function poseLook(px,py,ph,lx,ly,lh){ // eye in plan metres, look-at point in plan metres

    const e = MJ.toPlan(t, sx*(hw-0.7), sy*(hd-0.5)), l = MJ.toPlan(t, -sx*(hw*0.55), -sy*(hd-1.2));

      return [[g.x,0.6,1.7, g.x+1.5,2.2,1.2,'Screen wall inside the gate: turn right'], [ex[0],ex[1],1.7, ex[0]-0.4,ex[1]+6,1.1,'Past the screen wall'],

    [g.x+s*0.3,11,1.7, f.x,f.y,0.6,'Fire pit with floor seating'], [f.x+s*-2.2,f.y-5.2,2.4, f.x,f.y,0.3,'Fire pit with floor seating'],

function onChange(kind,id){

  else if (kind==='fence'){ buildFence(); }
  else if (kind==='north'){ setNight(night); }
  else if (kind==='move'){
    const it = MJ.find(id); if (!it) return; if (items[id]) place(items[id], it);

  MJ.on(onChange);

  document.getElementById('orbitBtn').addEventListener('click', () => { stopTour(); anim = null; setAuto(!autoTurn); });
  document.getElementById('lblBtn').addEventListener('click', e => { labelsOn = !labelsOn; e.currentTarget.setAttribute('aria-pressed', String(labelsOn)); });

(function(){
